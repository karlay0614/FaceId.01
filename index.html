<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>語音引導多人身分辨識測試</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(9, 24, 42, 0.92);
      --panel-2: rgba(17, 39, 64, 0.88);
      --line: rgba(148, 190, 228, 0.25);
      --text: #eef8ff;
      --muted: #a9c3d8;
      --accent: #39d7be;
      --accent-2: #56a8ff;
      --warning: #ffd166;
      --danger: #ff7185;
      --good: #66f0a9;
    }

    * { box-sizing: border-box; }
    html, body { 
        margin: 0; 
        min-height: 100%; 
        background: var(--bg); 
        color: var(--text); 
        font-family: "Microsoft JhengHei", system-ui, sans-serif; 
    }
    body { overflow-x: hidden; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 16, 29, 0.97);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.65rem); }
    header .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }

    .header-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.38rem 0.68rem;
      font-size: 0.82rem;
      font-weight: 800;
      background: rgba(255,255,255,0.04);
    }
    .pill.good { border-color: rgba(102, 240, 169, 0.5); color: var(--good); }
    .pill.warn { border-color: rgba(255, 209, 102, 0.5); color: var(--warning); }
    .pill.bad { border-color: rgba(255, 113, 133, 0.5); color: var(--danger); }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 390px);
      gap: 1rem;
      padding: 1rem;
      min-height: 0;
    }

    .camera-card, .panel {
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0,0,0,0.28);
    }

    .camera-card { overflow: hidden; display: flex; flex-direction: column; min-height: 530px; }
    
    .camera-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 13, 24, 0.8);
    }

    .camera-source-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .camera-source-controls label { color: #c1d6e8; font-size: 0.86rem; font-weight: 900; }
    #camera-select {
      min-height: 40px;
      max-width: min(46vw, 360px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.7rem;
      padding: 0.45rem 2rem 0.45rem 0.7rem;
      color: white;
      background: #0b2239;
      font: inherit;
      font-weight: 800;
    }
    #camera-select:disabled { opacity: 0.55; cursor: not-allowed; }
    
    .camera-stage {
      position: relative;
      flex: 1;
      min-height: 430px;
      background: #02070d;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    video { display: none; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }

    .center-message {
      position: absolute;
      left: 50%;
      bottom: 1.1rem;
      transform: translateX(-50%);
      width: min(92%, 780px);
      z-index: 8;
      padding: 0.85rem 1rem;
      text-align: center;
      border-radius: 1rem;
      border: 1px solid rgba(86, 168, 255, 0.42);
      background: rgba(3, 14, 28, 0.85);
      backdrop-filter: blur(8px);

    .side { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
    .panel { padding: 1rem; }
    .panel h2 { font-size: 1rem; margin: 0 0 0.75rem; }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    button {
      min-height: 50px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 0.9rem;
      padding: 0.7rem 0.8rem;
      color: white;
      background: #173352;
      font: inherit;

    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12); }

    button.primary { background: linear-gradient(135deg, #0b9f8b, #1469b9); }
    button.danger { background: #72283a; }

    .voice-command {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 0.85rem;
      background: rgba(57, 215, 190, 0.08);
      border: 1px solid rgba(57, 215, 190, 0.2);
      color: #c8fff5;

      font-size: 0.88rem;
    }

    .name-edit-panel {
      margin-top: 0.75rem;
      padding: 0.8rem;
      border-radius: 0.9rem;
      border: 1px solid rgba(255, 209, 102, 0.48);
      background: rgba(255, 209, 102, 0.08);
    }
    #name-edit-input {
      width: 100%;
      min-height: 48px;
      border: 2px solid rgba(255, 209, 102, 0.58);
      border-radius: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: rgba(3, 14, 28, 0.92);
      color: white;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      outline: none;
    }

    .list { display: flex; flex-direction: column; gap: 0.55rem; max-height: 210px; overflow: auto; }
    .person-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.75rem;

    .person-name { font-weight: 900; }

      display: flex;
      flex-direction: column-reverse;
      gap: 0.42rem;
    }
    .event {
      padding: 0.48rem 0.58rem;

    .settings-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.8rem; margin-top: 0.65rem; }
    .startup-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: radial-gradient(circle at top, #103552, #040b13 60%);
    }
    .startup-card {
      width: min(720px, 96vw);
      padding: clamp(1.2rem, 4vw, 2rem);
      border-radius: 1.5rem;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(5, 18, 32, 0.96);
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
      text-align: center;
    }
    .hidden { display: none !important; }
    
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .camera-card { min-height: 450px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>語音引導多人身分辨識測試</h1>

    <main>
      <section class="camera-card">

          <div class="camera-source-controls">

  <div id="startup-overlay" class="startup-overlay">
    <div class="startup-card">
      <h2>先啟動攝影機與語音權限</h2>
      <p>瀏覽器要求使用者先點擊一次，才能開啟攝影機、麥克風及語音播放。</p>
      <button id="startup-btn" class="primary" style="width: 100%; margin-top: 1rem;">啟動攝影機、模型與語音</button>
      <p id="startup-status" style="margin-top: 1rem; color: #a9c3d8;">第一次載入需要網路下載AI模型，可能需要一些時間。</p>
    </div>

  <script>
    'use strict';
    const STORAGE_KEY = 'voice-guided-face-identities-v1';
    const HUMAN_VERSION = '3.3.6';
    const MAX_PEOPLE = 6;
    const MATCH_MARGIN = 0.035;

    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const centerMessage = document.getElementById('center-message');
    const cameraSummary = document.getElementById('camera-summary');
    const fpsDisplay = document.getElementById('fps-display');
    const modePill = document.getElementById('mode-pill');
    const voicePill = document.getElementById('voice-pill');
    
    // UI Elements
    const startupBtn = document.getElementById('startup-btn');
    const enrollBtn = document.getElementById('enroll-btn');
    const testBtn = document.getElementById('test-btn');
    const idleBtn = document.getElementById('idle-btn');
    const listBtn = document.getElementById('list-btn');
    const clearBtn = document.getElementById('clear-btn');
    const thresholdInput = document.getElementById('threshold');
    const registeredList = document.getElementById('registered-list');
    const eventLog = document.getElementById('event-log');

    // State Variables
    let human = null;
    let mediaStream = null;
    let running = false;
    let detectionBusy = false;
    let currentMode = 'idle';
    let registeredUsers = loadUsers();
    let eventItems = [];

// ====== LINE 機器人推播設定 ======
// 把下方引號內的網址，替換成你剛剛部署拿到的 GAS 網址
const GAS_URL = 'https://script.google.com/macros/s/AKfycbylEdOj5AxUvoIZAuhjfLPz982ucIHQHxUTI-TyfaZZRXqr86muGbaAU4X5cgqZeA8pgQ/exec'; 
const notifyCooldown = {}; // 紀錄通知冷卻時間，避免重複推播

// 跌倒判斷採「姿勢角度 + 身體框比例 + 持續時間」的簡易規則，結果僅代表疑似跌倒。
const fallStates = new Map();
const FALL_HOLD_MS = 1400;          // 姿勢連續符合約 1.4 秒才發出警示
const FALL_RECOVERY_MS = 2500;      // 姿勢恢復一段時間後，才允許下一次警示
const FALL_KEYPOINT_MIN_SCORE = 0.20;
const FALL_NOTIFY_COOLDOWN_MS = 60000;

function sendLineMessage(name) {
  console.log("觸發 LINE 通知：", name);

  const now = Date.now();

  // 同一個人 30 秒內最多傳送一次
  if (
    notifyCooldown[name] &&
    now - notifyCooldown[name] < 30000
  ) {
    return;
  }

  notifyCooldown[name] = now;

  const formData = new URLSearchParams();
  formData.append(
    'message',
    `【系統通知】\n鏡頭偵測到「${name}」出現了！`
  );

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: formData.toString()
  })
  .then(() => {
    console.log(
      `已送出 GAS 通知請求：${name}；請確認 GAS 執行記錄`
    );
  })
  .catch(error => {
    console.error('GAS 網路請求失敗：', error);
  });
}

// 跌倒警示使用獨立函式，避免沿用「人員出現」的通知文字。
function sendLineFallAlert(message, personKey) {
  const now = Date.now();
  const cooldownKey = `fall-${personKey}`;
  if (notifyCooldown[cooldownKey] && now - notifyCooldown[cooldownKey] < FALL_NOTIFY_COOLDOWN_MS) return;
  notifyCooldown[cooldownKey] = now;

  const formData = new URLSearchParams();
  formData.append('message', `【疑似跌倒警示】\n${message}\n請盡快確認現場狀況。`);

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: formData.toString()
  }).then(() => {
    console.log('已送出疑似跌倒警示，請至 GAS 執行記錄確認。');
  }).catch(error => {
    console.error('跌倒警示傳送失敗：', error);
  });
}

function getBodyKeypoint(body, part) {
  return body?.keypoints?.find(point =>
    point.part === part && point.score >= FALL_KEYPOINT_MIN_SCORE &&
    Number.isFinite(point.position?.x) && Number.isFinite(point.position?.y)
  ) || null;
}

function midpoint(a, b) {
  return { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };
}

// MoveNet 的關鍵點名稱使用 leftShoulder/rightShoulder/leftHip/rightHip。
function estimateFallPose(body) {
  const leftShoulder = getBodyKeypoint(body, 'leftShoulder');
  const rightShoulder = getBodyKeypoint(body, 'rightShoulder');
  const leftHip = getBodyKeypoint(body, 'leftHip');
  const rightHip = getBodyKeypoint(body, 'rightHip');
  if (!leftShoulder || !rightShoulder || !leftHip || !rightHip) return null;

  const shoulderCenter = midpoint(leftShoulder, rightShoulder);
  const hipCenter = midpoint(leftHip, rightHip);
  const dx = Math.abs(hipCenter.x - shoulderCenter.x);
  const dy = Math.abs(hipCenter.y - shoulderCenter.y);
  const torsoAngle = Math.atan2(dx, Math.max(dy, 1)) * 180 / Math.PI;

  const box = body.box || [0, 0, 0, 1];
  const boxWidth = Number(box[2]) || 0;
  const boxHeight = Math.max(Number(box[3]) || 1, 1);
  const aspectRatio = boxWidth / boxHeight;

  // 單一畫面可能因彎腰、坐下而誤判，因此後續還會要求姿勢持續一段時間。
  const horizontalTorso = torsoAngle >= 58;
  const horizontalBodyBox = aspectRatio >= 0.80;
  return {
    candidate: horizontalTorso && horizontalBodyBox,
    torsoAngle,
    aspectRatio
  };
}

function updateFallDetection(bodies) {
  const now = Date.now();
  const visibleKeys = new Set();
  const safeBodies = Array.isArray(bodies) ? bodies : [];

  safeBodies.forEach((body, index) => {
    const key = String(Number.isFinite(body.id) ? body.id : index);
    visibleKeys.add(key);
    const pose = estimateFallPose(body);
    let state = fallStates.get(key) || {
      candidateSince: 0,
      uprightSince: 0,
      alerted: false,
      lastSeen: now
    };
    state.lastSeen = now;

    if (pose?.candidate) {
      state.uprightSince = 0;
      if (!state.candidateSince) state.candidateSince = now;
      if (!state.alerted && now - state.candidateSince >= FALL_HOLD_MS) {
        state.alerted = true;
        const label = `畫面中的第 ${index + 1} 位人員`;
        addEvent(`${label}持續呈現接近水平的姿勢，判定為「疑似跌倒」`);
        sendLineFallAlert(`${label}疑似跌倒，請確認現場狀況。`, key);
      }
    } else if (pose) {
      state.candidateSince = 0;
      if (state.alerted) {
        if (!state.uprightSince) state.uprightSince = now;
        if (now - state.uprightSince >= FALL_RECOVERY_MS) {
          state.alerted = false;
          state.uprightSince = 0;
          addEvent(`第 ${index + 1} 位人員姿勢已恢復，解除跌倒警示狀態`);
        }
      }
    } else {
      // 關鍵點不足時不作跌倒結論，也不立刻解除已發出的警示。
      state.candidateSince = 0;
      state.uprightSince = 0;
    }
    fallStates.set(key, state);
  });

  // 清除長時間離開畫面的舊追蹤狀態。
  for (const [key, state] of fallStates.entries()) {
    if (!visibleKeys.has(key) && now - state.lastSeen > 5000) fallStates.delete(key);
  }
}
// ================================
    
    const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
    const speechSupported = Boolean(SpeechRecognitionApi && window.speechSynthesis);
    let commandRecognizer = null;
    let speechBusy = false;

    function speak(text) {
      if (!text || !window.speechSynthesis) return Promise.resolve();
      return new Promise(resolve => {
        speechBusy = true;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.onend = () => { speechBusy = false; resolve(); };
        utterance.onerror = () => { speechBusy = false; resolve(); };
        window.speechSynthesis.speak(utterance);
      });
    }

    function loadUsers() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }
    }

    function saveUsers() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(registeredUsers));
      renderRegisteredUsers();
    }

    function addEvent(message) {
      const time = new Date();
      eventItems.push({ time, message });
      if (eventItems.length > 50) eventItems.shift();
      eventLog.innerHTML = eventItems.map(item => 
        `<div class="event"><time style="color:var(--muted); margin-right:5px;">${item.time.toLocaleTimeString('zh-TW', { hour12: false })}</time>${item.message}</div>`
      ).reverse().join('');
    }

    function renderRegisteredUsers() {
      registeredList.innerHTML = registeredUsers.length === 0 
        ? '<div style="color:var(--muted)">尚未註冊任何使用者。</div>' 
        : registeredUsers.map((user, i) => `
          <div class="person-row">
            <div>
              <div class="person-name">${user.name}</div>
              <div class="person-meta">${user.samples.length}組特徵</div>
            </div>
            <button class="danger" onclick="removeUser(${i})">刪除</button>
          </div>
        `).join('');
    }
    
    window.removeUser = async function(index) {
        if(confirm(`確定刪除 ${registeredUsers[index].name} 嗎？`)){
            registeredUsers.splice(index, 1);
            saveUsers();
        }
    }

    function setMode(mode, message = '') {
      currentMode = mode;
      modePill.textContent = mode === 'test' ? '測試模式' : mode === 'enroll' ? '註冊模式' : '待機模式';
      if (message) centerMessage.textContent = message;
    }

    function renderFrame(result, matches) {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

       const bodies = Array.isArray(result?.body) ? result.body : [];
       if (bodies.length) human.draw.body(canvas, bodies);
       bodies.forEach((body, index) => {
           const box = body.box || [0, 0, 0, 0];
           const state = fallStates.get(String(Number.isFinite(body.id) ? body.id : index));
           const label = state?.alerted ? `第${index + 1}人：疑似跌倒` : `第${index + 1}人`;
           ctx.font = "18px Microsoft JhengHei";
           ctx.fillStyle = state?.alerted ? "#ff7185" : "#39d7be";
           ctx.fillText(label, box[0], Math.max(22, box[1] - 8));
       });

       // Draw faces
      const faces = result?.face || [];
      faces.forEach(face => {
          const box = face.box;
          if(!box) return;
          
          let label = "未知", color = "#ffd166";
          
          if(currentMode === 'test' && face.embedding) {
              const match = bestIdentityMatch(face.embedding);
              if(match.accepted) {
                  label = `${match.name} ${Math.round(match.similarity*100)}%`;
                  color = "#4df0a5";
                sendLineMessage(match.name);
              }
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.strokeRect(box[0], box[1], box[2], box[3]);
          ctx.fillStyle = color;
          ctx.font = "20px Microsoft JhengHei";
          ctx.fillText(label, box[0], box[1] - 10);
      });
    }

    function bestIdentityMatch(embedding) {
      if (!embedding || !registeredUsers.length) return { name: null, similarity: 0, accepted: false };
      
      const scores = registeredUsers.map(user => {
        let best = 0;
        user.samples.forEach(sample => {
          const similarity = human.match.similarity(sample, embedding);
          if (similarity > best) best = similarity;
        });
        return { name: user.name, similarity: best };
      }).sort((a, b) => b.similarity - a.similarity);

      const top = scores[0];
      const threshold = Number(thresholdInput.value) / 100;
      return {
        ...top,
        accepted: top.similarity >= threshold
      };
    }

    async function detectionLoop() {
      if (!running || video.readyState < 2) {
          requestAnimationFrame(detectionLoop);
          return;
      }
      if (!detectionBusy) {
        detectionBusy = true;
        const started = performance.now();
        try {
           const result = await human.detect(video);
           const bodies = Array.isArray(result?.body) ? result.body : [];
           updateFallDetection(bodies);
           renderFrame(result, []);
           fpsDisplay.textContent = `推論：${Math.round(performance.now() - started)} ms`;
           const fallCount = bodies.filter(body => {
             const key = String(Number.isFinite(body.id) ? body.id : bodies.indexOf(body));
             return fallStates.get(key)?.alerted;
           }).length;
           cameraSummary.textContent = `偵測到 ${result.face?.length || 0} 張臉｜骨架 ${bodies.length} 人｜疑似跌倒 ${fallCount} 人`;
         } catch (error) {
           cameraSummary.textContent = `偵測錯誤：${error?.message || error}`;
           console.error('Human 偵測錯誤：', error);
        } finally {
          detectionBusy = false;
        }
      }
      requestAnimationFrame(detectionLoop);
    }

    function startCommandRecognition() {
      if (!SpeechRecognitionApi || speechBusy) return;
      try {
          commandRecognizer = new SpeechRecognitionApi();
          commandRecognizer.lang = 'zh-TW';
          commandRecognizer.continuous = false;
          commandRecognizer.onresult = (event) => {
              const text = event.results[0][0].transcript;
              voicePill.textContent = `聽到: ${text}`;
              handleVoiceCommand(text);
          };
          commandRecognizer.onend = () => {
              if(running) setTimeout(startCommandRecognition, 500);
          };
          commandRecognizer.start();
      } catch(e) { }
    }

    function handleVoiceCommand(text) {
        if(/註冊/.test(text)) enrollBtn.click();
        else if(/開始測試/.test(text)) testBtn.click();
        else if(/停止/.test(text)) idleBtn.click();
        else if(/清除/.test(text)) clearBtn.click();
    }

    async function beginEnrollment() {
        setMode('enroll', '請看著鏡頭，保持不動。');
        addEvent('開始註冊新使用者');
        await speak('開始註冊。請說出您的名字。');
        
        // Simulating voice input for name via prompt for reliability in standard demo
        const name = prompt("請輸入您的姓名以進行註冊:", "測試者");
        if(!name) {
            setMode('idle', '已取消註冊');
            return;
        }

        await speak(`${name}，請保持臉部在畫面中央。`);
        
        let samples = [];
        let attempts = 0;
        
        // Capture 3 samples
        while(samples.length < 3 && attempts < 50 && currentMode === 'enroll') {
            await new Promise(r => setTimeout(r, 500));
            attempts++;
            
            if(human.result?.face?.length === 1) {
                const face = human.result.face[0];
                if(face.embedding) {
                    samples.push(Array.from(face.embedding));
                    centerMessage.textContent = `已記錄 ${samples.length}/3 組特徵`;
                    await speak(`第${samples.length}組`);
                }
            }
        }
        
        if(samples.length >= 3) {
            registeredUsers.push({ name, samples, createdAt: new Date().toISOString() });
            saveUsers();
            await speak(`註冊成功。`);
            setMode('idle', '註冊成功，請開始測試。');
        } else {
            await speak(`無法取得清晰人臉，註冊失敗。`);
            setMode('idle', '註冊失敗');
        }
    }

    async function initializeSystem() {
      startupBtn.disabled = true;
      document.getElementById('startup-status').textContent = '啟動中...';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        await video.play();
        document.getElementById('camera-pill').textContent = "攝影機正常";
        document.getElementById('camera-pill').classList.replace('warn', 'good');

        const config = {
          backend: 'webgl',
          modelBasePath: `https://cdn.jsdelivr.net/npm/@vladmandic/human@${HUMAN_VERSION}/models/`,
          face: { enabled: true, detector: { maxDetected: MAX_PEOPLE }, description: { enabled: true } },
           body: {
             enabled: true,
             // MultiPose 才是多人骨架模型；maxDetected 只是人數上限，不會把單人模型變成多人模型。
             modelPath: 'https://cdn.jsdelivr.net/gh/vladmandic/human-models/models/movenet-multipose.json',
             maxDetected: MAX_PEOPLE,
             minConfidence: 0.20
           }
        };
        human = new Human.Human(config);
        await human.load();
        console.log('Human 版本：', human.version);
        console.log('骨架模型設定：', human.config.body.modelPath, '最多人數：', human.config.body.maxDetected);
        
        document.getElementById('model-pill').textContent = "模型已載入";
        document.getElementById('model-pill').classList.replace('warn', 'good');

        running = true;
        document.getElementById('startup-overlay').classList.add('hidden');
        
        // Enable buttons
        [enrollBtn, testBtn, idleBtn, clearBtn, listBtn].forEach(b => b.disabled = false);
        
        renderRegisteredUsers();
        detectionLoop();
        
        if(speechSupported) {
            document.getElementById('voice-pill').textContent = "語音就緒";
            document.getElementById('voice-pill').classList.replace('warn', 'good');
            startCommandRecognition();
        }

      } catch (err) {
          document.getElementById('startup-status').textContent = '啟動失敗: ' + err.message;
      }
    }

    startupBtn.addEventListener('click', initializeSystem);
    enrollBtn.addEventListener('click', beginEnrollment);
    testBtn.addEventListener('click', () => { setMode('test', '測試中... 請看向鏡頭'); addEvent('開始測試模式'); });
    idleBtn.addEventListener('click', () => { setMode('idle', '待機中'); addEvent('停止測試'); });
    clearBtn.addEventListener('click', () => { 
        if(confirm("清除所有資料？")) {
            registeredUsers = [];
            saveUsers();
            addEvent('清除所有資料');
        }
    });
    
    thresholdInput.addEventListener('input', () => {
        document.getElementById('threshold-value').textContent = thresholdInput.value + '%';
    });
    
    document.getElementById('threshold-value').textContent = thresholdInput.value + '%';

  </script>
</body>
</html>
